version: '3.8'

services:
  # Existing SaveHere services would be here...
  # This is what you'd add to the existing docker-compose.yml

  HoustonServer:
    build: ./HoustonServer
    container_name: savehere-HoustonServer
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - LASTFM_API_KEY=${LASTFM_API_KEY:-xyg}
      - PORT=5000
    volumes:
      - music_user_data:/app/user_data
      - music_profile_pics:/app/profile_pics
      - music_app_data:/app
    restart: unless-stopped
    networks:
      - savehere-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - savehere-main  # Assuming there's a main SaveHere service

volumes:
  # Existing SaveHere volumes...
  music_user_data:
  music_profile_pics:
  music_app_data:

networks:
  savehere-network:
    driver: bridge